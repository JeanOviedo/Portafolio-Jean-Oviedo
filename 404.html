<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página no encontrada | Jean Carlos Oviedo</title>
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#070b16" />
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/icon-32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/img/icons/icon-180.png" />
  <script>
    (function () {
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark'); }
      catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@600&display=swap"
    rel="stylesheet" />
  <!-- Absolute paths: GitHub Pages serves this file for any missing URL, at any depth -->
  <link rel="stylesheet" href="/css/styles.css?v=4" />
  <style>
    .notfound {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 32px var(--gutter);
      position: relative;
      overflow: hidden;
      isolation: isolate;
    }

    .notfound-code {
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--cyan);
      letter-spacing: 0.12em;
      margin-bottom: 16px;
    }

    .notfound h1 {
      font-size: clamp(2.2rem, 6vw, 4rem);
      letter-spacing: -0.04em;
      margin-bottom: 32px;
    }

    .notfound .brand img {
      height: 30px;
      width: auto;
      margin: 0 auto 48px;
    }
  </style>
</head>

<body>
  <main class="notfound">
    <div class="hero-bg" aria-hidden="true">
      <div class="hero-grid-lines"></div>
      <div class="hero-glow hero-glow--violet"></div>
      <div class="hero-glow hero-glow--cyan"></div>
    </div>
    <div>
      <a class="brand" href="/"><img id="siteLogo" src="/img/logo.png" alt="Jean Oviedo" width="588" height="131" /></a>
      <p class="notfound-code">404</p>
      <h1>Página no encontrada</h1>
      <a class="btn btn-primary" href="/">Volver al inicio</a>
    </div>
  </main>
  <script>
    // Dark logo variant for the light theme (same behaviour as the main page)
    if (document.documentElement.getAttribute('data-theme') === 'light') {
      document.getElementById('siteLogo').src = '/img/logonegro.png';
    }
  </script>
</body>

</html>
